group: io.kestra.plugin.argocd.apps
name: "apps"
title: "Argo CD Apps"
description: "GitOps-focused tasks that sync, inspect or patch an Argo CD application via the Argo CD CLI. Use `Sync` to apply the desired GitOps Git state, `Status` to read sync/health, conditions, and resources, and `Patch` to update the application spec."
body: "Use `Sync` to apply the desired GitOps Git state (supports prune/dry-run/force plus optional revision and timeout), `Status` to read sync/health, conditions, and resources (optionally with `refresh`), and `Patch` to update the application spec with a JSON or merge patch. All tasks need the Argo CD `server`, `token`, and `application` along with optional TLS/connection flags (`insecure`, `plaintext`, `grpcWeb`, `serverCert`) and CLI image/version overrides."
